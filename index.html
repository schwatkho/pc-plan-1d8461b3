/* Theme from popcont.ai (light theme tokens in /_next/static/css/dc19bb286ff123a2.css .light{...}) */
:root{
  --bg:#f7f6f4; --bg3:#f0eeeb; --s1:#fff; --s2:#f6f4f1; --s3:#e9e5e0;
  --bd:hsla(0,0%,7%,.08); --bd2:hsla(0,0%,7%,.13);
  --t1:#111; --t2:#45444a; --t3:#85838c;
  --v:#fe5e15; --v2:#f2701f; --v3:#c24a0a; --bl:#1e51e5; --bl2:#1a46c7;
  --yl:#f5a623; --yl-d:#febe55; --cy:#b1f8f5; --cy2:#7fe6e1; --gr:#059669; --gr2:#047857; --am:#b45309; --re:#dc2626;
  --mint:#eafaf9; --peach:#ffeee4; --cream:#fff7ec;
  --r-sm:12px; --r:16px; --r-lg:20px;
  --gtx:linear-gradient(120deg,#fe5e15,#f5a623);
  --sh:0 2px 8px hsla(0,0%,7%,.06),0 10px 30px hsla(0,0%,7%,.06);
  --sh2:0 1px 2px hsla(0,0%,7%,.05),0 4px 14px hsla(0,0%,7%,.07);
  --shv:0 6px 18px rgba(30,81,229,.32);
  --display:'Space Grotesk','FC Iconic',sans-serif;
  --head:'FC Iconic','Space Grotesk',sans-serif;
  --body:'DM Sans','FC Iconic',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#e9e5e0;overflow:hidden;font-family:var(--body);color:var(--t1)}
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{width:1280px;height:720px;position:relative;transform-origin:center center;flex:none;box-shadow:0 10px 40px rgba(17,17,17,.12)}
.slide{position:absolute;inset:0;background:var(--bg);overflow:hidden;display:none;flex-direction:column;padding:48px 72px 74px}
.slide.active{display:flex}
.brandmark{position:absolute;left:72px;right:72px;bottom:20px;height:34px;display:flex;align-items:center;justify-content:space-between;font-family:var(--display);font-size:15px;color:var(--t3);letter-spacing:.2px;z-index:1}
.brandmark i{display:block;width:44px;height:34px}
.kicker{display:inline-flex;align-items:center;gap:10px;font-family:var(--head);font-size:18px;font-weight:700}
.kicker b{background:var(--bl);color:#fff;border-radius:999px;padding:3px 14px;font-weight:700;box-shadow:var(--shv)}
.kicker b.or{background:var(--v);box-shadow:0 6px 18px rgba(254,94,21,.3)}
h2{font-family:var(--head);font-weight:700;font-size:52px;line-height:1.15;margin:8px 0 18px;color:var(--t1);letter-spacing:-.3px}
.hdr{flex:none}
.grow{flex:1;min-height:0;overflow:hidden;position:relative}
.sub{font-size:20px;color:var(--t2);line-height:1.6;margin:-6px 0 18px;flex:none;max-width:1080px}
/* tables */
.tablewrap{position:relative;font-size:22px}
table.deck{width:100%;border-collapse:separate;border-spacing:0 8px;font-size:1em}
table.deck th{font-family:var(--head);font-weight:700;font-size:.78em;text-align:left;color:var(--t3);padding:0 18px 2px}
table.deck th.c{text-align:center}
table.deck td{background:var(--s1);padding:.6em 18px;line-height:1.4;vertical-align:middle;border-top:1px solid var(--bd);border-bottom:1px solid var(--bd)}
table.deck tr:not(.empty) td:not(.del){box-shadow:0 3px 10px -6px rgba(17,17,17,.12)}
table.deck td:first-child{border-left:1px solid var(--bd);border-radius:var(--r) 0 0 var(--r);font-family:var(--head);font-weight:700;font-size:1.06em;color:var(--t1)}
table.deck td.last{border-radius:0 var(--r) var(--r) 0;border-right:1px solid var(--bd)}
table.deck td.prod{color:var(--bl);font-weight:500}
table.deck td.cc{text-align:center}
table.deck td.blank{color:var(--bl);font-family:var(--display);font-weight:700;text-align:center}
table.deck td.note{color:var(--t2);font-size:.86em}
table.deck tr.total td{background:var(--cream);border-color:rgba(245,166,35,.35);font-family:var(--head);font-weight:700;color:var(--t1)}
table.deck tr.total td:first-child{border-left:4px solid var(--v)}
table.deck col.c4{width:52px} body:not(.edit) table.deck col.c4{width:0}
td.pot span.pill{display:inline-block;border-radius:14px;padding:.14em .75em;font-weight:500;font-size:.92em;background:var(--s2);color:var(--t2);border:1px solid var(--bd2)}
td.pot.won span.pill{background:#e3f5ec;color:var(--gr2);border-color:rgba(5,150,105,.35)}
td.pot.hot span.pill{background:var(--cream);color:var(--am);border-color:rgba(245,166,35,.5)}
td.pot.warm span.pill{background:var(--peach);color:var(--v3);border-color:rgba(254,94,21,.35)}
td.del{width:44px;background:transparent!important;border:none!important;padding:0 0 0 8px!important;box-shadow:none!important}
.delbtn{width:30px;height:30px;border-radius:50%;border:1px solid var(--bd2);background:#fff;color:var(--re);font-size:18px;line-height:26px;cursor:pointer;box-shadow:var(--sh2)}
.delbtn:hover{background:var(--re);color:#fff}
tr.empty td{background:transparent;border:2px dashed var(--bd2);color:var(--t3);text-align:center;border-radius:var(--r)!important;font-family:var(--body)!important;font-weight:400!important;font-size:.9em!important;padding:1.4em}
.addrow{margin-top:6px;font-family:var(--head);font-size:17px;font-weight:700;color:#fff;background:var(--bl);border:none;border-radius:999px;padding:9px 22px;cursor:pointer;box-shadow:var(--shv)}
.addrow:hover{background:var(--bl2)}
.addrow:active{transform:translateY(1px)}
/* editable */
body.edit [contenteditable="true"]{outline:1px dashed transparent;border-radius:6px;cursor:text;transition:outline-color .15s}
body.edit [contenteditable="true"]:hover{outline-color:rgba(30,81,229,.45)}
body.edit [contenteditable="true"]:focus{outline:2px solid var(--bl);background:rgba(30,81,229,.06)}
body:not(.edit) .editonly{display:none!important}
[contenteditable]:empty::before{content:attr(data-ph);color:#b3b1b8}
body:not(.edit) [contenteditable]:empty::before{content:none}
/* title */
.s-title{padding:0;background:radial-gradient(900px 420px at 50% 118%,#ffeee4 0%,#ffeee4 40%,rgba(255,238,228,0) 72%),var(--cy)}
.s-title .left{position:absolute;left:96px;top:96px;width:640px;z-index:2}
.s-title .biglogo{width:190px;height:134px}

  if(confirm('ต้องการลบ "'+name+'" ใช่ไหม?')){S.tables[key].rows.splice(ri,1);dirty=true;save();render();toast('ลบแล้ว: '+name)}}

  try{const r=el.requestFullscreen?el.requestFullscreen():(el.webkitRequestFullscreen?el.webkitRequestFullscreen():null);if(r&&r.catch)r.catch(()=>{})}catch(e){}}

/* ---- data export: xlsx (OOXML, stored zip) + csv zip, fully client-side ---- */
const DATA_TABLES=[['brand','Brand'],['agency','Agency'],['production','Production house'],['media','Media'],['kpi','KPI'],['split','แบ่งเป้าตาม 4 กลุ่ม'],['example','ตัวอย่างการคำนวณ'],['__log','Log การตาม']];
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u){let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRC[(c^u[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function zip(files){const enc=new TextEncoder(),parts=[],cen=[];let off=0;const d=new Date();
  const dt=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate(),tm=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1);
  for(const [name,data] of files){const nb=enc.encode(name),db=typeof data==='string'?enc.encode(data):data,crc=crc32(db);
    const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint16(10,tm,true);h.setUint16(12,dt,true);
    h.setUint32(14,crc,true);h.setUint32(18,db.length,true);h.setUint32(22,db.length,true);h.setUint16(26,nb.length,true);h.setUint16(28,0,true);
    parts.push(new Uint8Array(h.buffer),nb,db);
    const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);c.setUint16(12,tm,true);c.setUint16(14,dt,true);
    c.setUint32(16,crc,true);c.setUint32(20,db.length,true);c.setUint32(24,db.length,true);c.setUint16(28,nb.length,true);c.setUint32(42,off,true);
    cen.push(new Uint8Array(c.buffer),nb);off+=30+nb.length+db.length}
  const csize=cen.reduce((a,b)=>a+b.length,0),e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,csize,true);e.setUint32(16,off,true);
  return new Blob([...parts,...cen,new Uint8Array(e.buffer)],{type:'application/zip'})}
const xesc=v=>String(v==null?'':v).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function colName(i){let s='';i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26)}return s}
function tableData(key){if(key==='__log')return logData();const t=S.tables[key];const base=t.rows.map(r=>t.cols.map((c,i)=>r[i]==null?'':String(r[i])));
  if(!t.pot)return [t.cols.slice(),...base];
  return [t.cols.concat(['จำนวนครั้งที่ตาม','คุยล่าสุด (วันที่)','สถานะล่าสุด']),...t.rows.map((r,ri)=>{const L=logsOf(key,r),lt=sortedLogs(L)[0];return base[ri].concat([String(L.length),lt?lt.d||'':'',lt?lt.t||'':''])})]}
function logData(){const out=[['กลุ่ม','ชื่อ','วันที่','สถานะ/สิ่งที่คุย']];GROUPS.forEach(([k,n])=>S.tables[k].rows.forEach(r=>sortedLogs(logsOf(k,r)).reverse().forEach(x=>out.push([n,r[0]||'',x.d||'',x.t||'']))));return out}
function sheetXml(rows){const w=rows[0].map((_,ci)=>Math.min(70,Math.max(10,...rows.map(r=>[...(r[ci]||'')].length*1.15+2))));
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>${w.map((x,i)=>`<col min="${i+1}" max="${i+1}" width="${x.toFixed(1)}" customWidth="1"/>`).join('')}</cols><sheetData>${rows.map((r,ri)=>`<row r="${ri+1}">${r.map((v,ci)=>`<c r="${colName(ci)}${ri+1}" t="inlineStr"${ri===0?' s="1"':' s="2"'}><is><t xml:space="preserve">${xesc(v)}</t></is></c>`).join('')}</row>`).join('')}</sheetData></worksheet>`}
function stamp(){const d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`}
function download(blob,name){const u=URL.createObjectURL(blob),l=document.createElement('a');l.href=u;l.download=name;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function exportXlsx(){if(document.activeElement&&document.activeElement.isContentEditable)document.activeElement.blur();
  const sheets=DATA_TABLES.map(([k,n])=>[n.replace(/[\[\]:*?\/\\]/g,'-').slice(0,31),tableData(k)]);
  const files=[['[Content_Types].xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((_,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`],
   ['_rels/.rels',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
   ['xl/workbook.xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheets.map(([n],i)=>`<sheet name="${xesc(n)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets></workbook>`],
   ['xl/_rels/workbook.xml.rels',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((_,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}<Relationship Id="rId${sheets.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`],
   ['xl/styles.xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Tahoma"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Tahoma"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF1E51E5"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/><xf numFmtId="49" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`],
   ...sheets.map(([n,rows],i)=>[`xl/worksheets/sheet${i+1}.xml`,sheetXml(rows)])];
  const z=zip(files);download(new Blob([z],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),`popcont_B2B_Plan_data_${stamp()}.xlsx`);toast('ดาวน์โหลด .xlsx แล้ว')}
function exportCsv(){if(document.activeElement&&document.activeElement.isContentEditable)document.activeElement.blur();
  const q=v=>{v=String(v==null?'':v);return /[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const files=DATA_TABLES.map(([k,n],i)=>[`${String(i+1).padStart(2,'0')}_${n.replace(/[\\\/:*?"<>|]/g,'-')}.csv`,'\uFEFF'+tableData(k).map(r=>r.map(q).join(',')).join('\r\n')+'\r\n']);
  download(zip(files),`popcont_B2B_Plan_data_${stamp()}_csv.zip`);toast('ดาวน์โหลด CSV (.zip) แล้ว')}
document.getElementById('bData').onclick=exportXlsx;document.getElementById('bCsv').onclick=exportCsv;
document.getElementById('bExport').onclick=exportHtml;document.getElementById('bReset').onclick=reset;

  if(e.target.isContentEditable||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if(e.metaKey||e.ctrlKey||e.altKey)return;
  const k=e.key;if(['ArrowRight','ArrowDown','PageDown'].includes(k)){e.preventDefault();go(cur+1)}
  else if(['ArrowLeft','ArrowUp','PageUp'].includes(k)){e.preventDefault();go(cur-1)}

function layout(){const vp=document.getElementById('viewport'),bar=document.getElementById('bar'),hint=document.getElementById('hint');
  let top=0;if(!isPresent()){top=bar.offsetHeight;hint.style.top=top+'px';if(isEdit())top+=hint.offsetHeight}

  document.getElementById('toast').style.top=(top+12)+'px'}
